<svg class="hat-model-diagram" viewBox="0 0 1000 560" role="img" aria-labelledby="md-title md-desc" xmlns="http://www.w3.org/2000/svg">
<title id="md-title">How the model works</title>
<desc id="md-desc">Three neighbouring stretches of island seen from above, ocean at the bottom and the sound at the top. 1: each stretch starts from lidar elevation on a 10 metre grid. 2: storms push water and sand over a low dune and inland. 3: waves carry sand along the beach from one stretch to the next. 4: people add sand to the beach, rebuild the dunes, and protect or move the road.</desc>
<defs><marker id="md-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
<linearGradient id="md-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0ec"/><stop offset="1" stop-color="#9fbfd6"/></linearGradient>
<linearGradient id="md-fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.07" stop-color="#fff" stop-opacity="0"/><stop offset="0.93" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<pattern id="md-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12,0 L0,0 0,12" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/></pattern>
</defs>
