<svg class="hat-process dunes" viewBox="0 0 1000 350" role="img" aria-labelledby="dunes-t dunes-d" xmlns="http://www.w3.org/2000/svg">
<title id="dunes-t">Dunes are the island's first defence</title>
<desc id="dunes-d">Two slices across the island, sound on the left and ocean on the right, in the same storm. (a) Collision: the highest reach of the waves stays below a tall dune's crest. The waves cut into the front of the dune and carry that sand offshore, and the island behind stays dry. (b) Overwash: the waves reach higher than a low dune's crest, run over it, and leave a layer of sand across the island and the road.</desc>
