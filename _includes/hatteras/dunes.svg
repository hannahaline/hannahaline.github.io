<text x="12" y="28" text-anchor="start" font-size="16" fill="#2b2f31" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-opacity="0.85" stroke-linejoin="round"><tspan x="12" dy="0em">(a)</tspan></text>
<text x="44" y="28" text-anchor="start" font-size="15" fill="#2b2f31" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-opacity="0.85" stroke-linejoin="round"><tspan x="44" dy="0em">A tall dune holds the storm back</tspan></text>
