<svg class="hat-process dunes" viewBox="0 0 1000 330" role="img" aria-labelledby="dunes-t dunes-d" xmlns="http://www.w3.org/2000/svg">
<title id="dunes-t">Dunes are the island's first defence</title>
<desc id="dunes-d">Two slices across the island in the same storm. (a) A tall, continuous dune: the storm water and waves reach the dune but stop at it, and the island behind stays dry. (b) A low dune: the waves run over it and spread sand across the island behind.</desc>
