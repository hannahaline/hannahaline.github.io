<svg class="hat-process longshore" viewBox="0 0 1000 660" role="img" aria-labelledby="longshore-t longshore-d" xmlns="http://www.w3.org/2000/svg">
<title id="longshore-t">Waves move sand along the coast</title>
<desc id="longshore-d">A map of Hatteras Island from Oregon Inlet south to Cape Point and west to Hatteras Inlet. Waves arrive from the northeast and from the southeast. Along the east-facing shore, sand drifts south, more of it where the beach is eroding, and the drift ends at Cape Point, where the sand builds up. A close-up shows how each wave pushes sand up the beach at an angle and it slides straight back down, so the sand creeps along the shore.</desc>
