<svg class="hat-process groin" viewBox="0 0 1000 460" role="img" aria-labelledby="groin-t groin-d" xmlns="http://www.w3.org/2000/svg">
<title id="groin-t">How a groin traps sand</title>
<desc id="groin-d">A beach seen from above, land at the top and ocean below, with sand drifting along the shore from left to right. A groin, a short wall, runs from the beach out into the surf. On the left, the side the sand comes from, sand piles up against the groin and the beach is wider. On the right, the far side, the beach is cut off from that sand, so it is narrower and erodes.</desc>
