<svg class="hat-process overwash" viewBox="0 0 1000 360" role="img" aria-labelledby="overwash-t overwash-d" xmlns="http://www.w3.org/2000/svg">
<title id="overwash-t">Storms move sand across the island</title>
<desc id="overwash-d">A slice across the island in a storm, sound on the left and ocean on the right. The water is raised well above normal high tide, and waves run over a low dune. The sand they carry is laid down as a new layer, an overwash fan, across the island interior and toward the sound.</desc>
